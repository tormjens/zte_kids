name: Release

# Auto-versioning release on every push to master. The workflow owns the version
# number, so manifest.json never has to be edited by hand:
#   1. derive VERSION = <BASE>.<run_number>  (monotonic, unique per run)
#   2. write it into custom_components/zte_kids/manifest.json
#   3. commit that back to master ([skip ci] so it doesn't re-trigger)
#   4. tag vVERSION and publish a full GitHub Release (required by HACS)
#
# To start a new minor/major line later, just bump BASE below.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  BASE: "0.1"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: ver
        run: |
          VERSION="${BASE}.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Write version into manifest
        run: |
          f=custom_components/zte_kids/manifest.json
          jq --arg v "${{ steps.ver.outputs.version }}" '.version=$v' "$f" > "$f.tmp"
          mv "$f.tmp" "$f"

      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/zte_kids/manifest.json
          git commit -m "chore: release ${{ steps.ver.outputs.tag }} [skip ci]" || echo "manifest unchanged"
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin HEAD:master
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --notes "Automated release ${{ steps.ver.outputs.tag }}"
